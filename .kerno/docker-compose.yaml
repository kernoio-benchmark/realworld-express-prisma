services:
  postgres:
    image: "postgres:16-alpine"
    pull_policy: missing
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    environment:
      - "POSTGRES_USER=postgres"
      - "POSTGRES_PASSWORD=postgres"
      - "POSTGRES_DB=realworld"
    ports:
      - "0:5432"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U postgres -d realworld"
      interval: "3s"
      timeout: "5s"
      retries: "10"
    tmpfs:
      - /var/lib/postgresql/data
    labels:
      - external-url=postgresql://localhost:{{PORT}}/realworld?user=postgres&password=postgres

  sut:
    build:
      context: /home/ec2-user/aicore/examples/benchmarks/typescript/realworld-express-prisma
      dockerfile: .kerno/Dockerfile
    pull_policy: never
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    environment:
      - "DATABASE_URL=postgresql://postgres:postgres@postgres:5432/realworld"
      - "JWT_SECRET=this_is_a_secret_meeting_all_requirements_of_any_hs_algorithms"
      - "NODE_ENV=production"
      - "PORT=3000"
    ports:
      - "0:3000"
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - external-url=http://localhost:{{PORT}}
