id: get_existing_article_without_auth
description: Retrieve an existing article without authentication returns 200 OK with
  article data
subject:
  type: Endpoint
  method: GET
  path: /api/articles/{slug}
steps:
- id: setup_values
  description: Generate test data values
  action:
    type: Values
    outputs:
      username:
        type: RandomUuid
      email:
        type: RandomUuid
      title:
        type: RandomUuid
      description:
        type: StaticString
        value: Test description
      body:
        type: StaticString
        value: Test body
      slug:
        type: RandomUuid
- id: setup_data
  description: Create user and article in database
  action:
    type: ExecuteSql
    sql: SELECT table_name FROM information_schema.tables WHERE table_schema = 'public'
      AND table_type = 'BASE TABLE' ORDER BY table_name;
- id: call_get_article
  description: GET request to retrieve the article without authentication
  action:
    type: CallHttp
    request: |-
      GET /api/articles/{{ setup_values.slug }} HTTP/1.1
      Content-Type: application/json
- id: assert_response
  description: Assert 200 OK response with complete article data
  action:
    type: HttpAssert
    actual: '{{ call_get_article }}'
    expected: |-
      HTTP/1.1 200 OK
      Content-Type: application/json; charset=utf-8

      {
        "article": {
          "slug": "{{ setup_values.slug }}",
          "title": "{{ setup_values.title }}",
          "description": "{{ setup_values.description }}",
          "body": "{{ setup_values.body }}",
          "tagList": [],
          "favorited": false,
          "favoritesCount": 0,
          "author": {
            "username": "{{ setup_values.username }}",
            "bio": null,
            "image": null,
            "following": false
          }
        }
      }
    body_match: json_lenient
- id: cleanup
  description: Remove test data from database
  action:
    type: ExecuteSql
    sql: |-
      DELETE FROM article WHERE slug = '{{ setup_values.slug }}';
      DELETE FROM "user" WHERE username = '{{ setup_values.username }}';