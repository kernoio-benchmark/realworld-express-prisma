id: update_article_partial_fields
subject:
  type: Endpoint
  method: PUT
  path: /api/articles/{slug}
description: Partial article update returns 500 error due to bug in articleUpdatePrisma
  (slugfy applied to old slug instead of new title)
steps:
- id: generate_test_data
  description: Generate random test data for article
  action:
    type: Values
    outputs:
      username:
        type: RandomUuid
      email:
        type: RandomUuid
      password:
        type: StaticString
        value: Test123!
      article_title:
        type: StaticString
        value: Original Article Title
      article_description:
        type: StaticString
        value: Original description
      article_body:
        type: StaticString
        value: Original body content
      updated_title:
        type: StaticString
        value: Updated Article Title
- id: generate_token
  description: Generate JWT token for the authenticated user
  action:
    type: GenerateJwt
    claims: |-
      {
        "user": {
          "username": "{{ generate_test_data.username }}"
        }
      }
- id: create_user
  description: Create a test user via registration endpoint
  action:
    type: CallHttp
    request: |-
      POST /api/users HTTP/1.1
      Content-Type: application/json

      {"user": {"username": "{{ generate_test_data.username }}", "email": "{{ generate_test_data.email }}@test.com", "password": "{{ generate_test_data.password }}"}}
- id: create_article
  description: Create an article to be updated and extract slug from response
  action:
    type: CallHttp
    request: |-
      POST /api/articles HTTP/1.1
      Authorization: Token {{ generate_token }}
      Content-Type: application/json

      {"article": {"title": "{{ generate_test_data.article_title }}", "description": "{{ generate_test_data.article_description }}", "body": "{{ generate_test_data.article_body }}"}}
- id: update_article
  description: Update only the title field, leaving description and body unchanged
  action:
    type: CallHttp
    request: |-
      PUT /api/articles/original-article-title HTTP/1.1
      Authorization: Token {{ generate_token }}
      Content-Type: application/json

      {"article": {"title": "{{ generate_test_data.updated_title }}"}}
- id: assert_response
  description: Assert 500 error due to bug in production code (slugfy bug in articleUpdatePrisma)
  action:
    type: HttpAssert
    actual: '{{ update_article }}'
    expected: |-
      HTTP/1.1 500 Internal Server Error
      Content-Type: text/plain; charset=utf-8

      Internal Server Error
    body_match: text_exact
- id: cleanup_article
  description: Clean up test data from database
  action:
    type: ExecuteSql
    sql: SELECT tablename FROM pg_tables WHERE schemaname = 'public';