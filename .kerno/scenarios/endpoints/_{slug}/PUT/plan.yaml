add:
- id: update_article_success
  description: Successfully update an article with valid authentication and valid
    fields
  subject:
    type: Endpoint
    method: PUT
    path: /api/articles/{slug}
  steps:
  - id: generate_test_data
    description: Generate random test data for article creation and update
    action:
      type: Unimplemented
      intended_type: Values
  - id: create_user
    description: Create a test user via registration endpoint
    action:
      type: Unimplemented
      intended_type: CallHttp
  - id: create_article
    description: Create an article to be updated
    action:
      type: Unimplemented
      intended_type: CallHttp
  - id: generate_token
    description: Generate JWT token for the authenticated user
    action:
      type: Unimplemented
      intended_type: GenerateJwt
  - id: update_article
    description: Update the article with new title, description, and body
    action:
      type: Unimplemented
      intended_type: CallHttp
  - id: assert_response
    description: Assert 200 OK response with updated article data
    action:
      type: Unimplemented
      intended_type: HttpAssert
  - id: cleanup_article
    description: Delete the article from database
    action:
      type: Unimplemented
      intended_type: ExecuteSql
  - id: cleanup_user
    description: Delete the test user from database
    action:
      type: Unimplemented
      intended_type: ExecuteSql
