id: update_article_success
description: Successfully update an article with valid authentication and valid fields
subject:
  type: Endpoint
  method: PUT
  path: /api/articles/{slug}
steps:
- id: generate_test_data
  description: Generate random test data for article creation and update
  action:
    type: Values
    outputs:
      username:
        type: RandomUuid
      email:
        type: RandomUuid
      password:
        type: StaticString
        value: Test123!
      original_title:
        type: StaticString
        value: Original Article Title
      original_description:
        type: StaticString
        value: Original description
      original_body:
        type: StaticString
        value: Original body content
      updated_title:
        type: StaticString
        value: Updated Article Title
      updated_description:
        type: StaticString
        value: Updated description
      updated_body:
        type: StaticString
        value: Updated body content
- id: generate_token
  description: Generate JWT token for the authenticated user
  action:
    type: GenerateJwt
    claims: '{"user":{"username":"{{ generate_test_data.username }}"}}'
- id: create_user
  description: Create a test user via registration endpoint
  action:
    type: CallHttp
    request: |-
      POST /api/users HTTP/1.1
      Content-Type: application/json

      {"user":{"username":"{{ generate_test_data.username }}","email":"{{ generate_test_data.email }}@test.com","password":"{{ generate_test_data.password }}"}}
- id: create_article
  action:
    type: CallHttp
    request: |-
      POST /api/articles HTTP/1.1
      Authorization: Token {{ generate_token }}
      Content-Type: application/json

      {"article":{"title":"{{ generate_test_data.original_title }}","description":"{{ generate_test_data.original_description }}","body":"{{ generate_test_data.original_body }}"}}
  description: Create an article to be updated and capture its slug
- id: update_article
  description: Update the article with new title, description, and body
  action:
    type: CallHttp
    request: |-
      PUT /api/articles/original-article-title HTTP/1.1
      Authorization: Token {{ generate_token }}
      Content-Type: application/json

      {"article":{"title":"{{ generate_test_data.updated_title }}","description":"{{ generate_test_data.updated_description }}","body":"{{ generate_test_data.updated_body }}"}}