id: update_article_invalid_body
description: Attempt to update article with invalid body structure returns 400
subject:
  type: Endpoint
  method: PUT
  path: /api/articles/{slug}
steps:
- id: generate_test_data
  description: Generate random test data for article
  action:
    type: Values
    outputs:
      username:
        type: RandomUuid
      email:
        type: RandomUuid
      password:
        type: StaticString
        value: Test123!
      article_title:
        type: RandomUuid
      article_description:
        type: StaticString
        value: Test description
      article_body:
        type: StaticString
        value: Test body content
- id: create_user
  description: Create a test user via registration endpoint
  action:
    type: CallHttp
    request: |-
      POST /api/users HTTP/1.1
      Content-Type: application/json

      {
        "user": {
          "username": "{{ generate_test_data.username }}",
          "email": "{{ generate_test_data.email }}@test.com",
          "password": "{{ generate_test_data.password }}"
        }
      }
- id: create_article
  description: Create an article to be updated
  action:
    type: CallHttp
    request: |-
      POST /api/articles HTTP/1.1
      Authorization: Token {{ create_user }}
      Content-Type: application/json

      {
        "article": {
          "title": "{{ generate_test_data.article_title }}",
          "description": "{{ generate_test_data.article_description }}",
          "body": "{{ generate_test_data.article_body }}"
        }
      }
- id: generate_token
  description: Generate JWT token for the authenticated user
  action:
    type: GenerateJwt
    claims: |-
      {
        "user": {
          "username": "{{ generate_test_data.username }}"
        }
      }
- id: update_article
  description: Attempt to update with invalid body (e.g., title as number instead
    of string)
  action:
    type: CallHttp
    request: |-
      PUT /api/articles/{{ generate_test_data.article_title }} HTTP/1.1
      Authorization: Token {{ generate_token }}
      Content-Type: application/json

      {
        "article": {
          "title": 12345
        }
      }
- id: assert_response
  description: Assert 400 Bad Request with validation errors
  action:
    type: HttpAssert
    actual: '{{ update_article }}'
    expected: |-
      HTTP/1.1 400 Bad Request
      Content-Type: application/json; charset=utf-8

      {
        "errors": {
          "body": ["title must be a string"]
        }
      }
    body_match: json_lenient
- id: cleanup_article
  description: Delete the article and user via API
  action:
    type: CallHttp
    request: |-
      DELETE /api/articles/{{ generate_test_data.article_title }} HTTP/1.1
      Authorization: Token {{ generate_token }}