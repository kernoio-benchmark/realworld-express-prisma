- id: create_comment_authenticated_user_returns_201
  description: Authenticated user creates a comment on an existing article and receives
    201 Created with the comment details
  subject:
    type: Endpoint
    method: POST
    path: /api/articles/{slug}/comments
  steps:
  - id: generate_test_data
    description: Generate random values for test data
    action:
      type: Unimplemented
      intended_type: Values
  - id: setup_user_and_article
    description: Create a test user and article in the database for testing
    action:
      type: Unimplemented
      intended_type: ExecuteSql
  - id: generate_token
    description: Generate JWT token for the authenticated user
    action:
      type: Unimplemented
      intended_type: GenerateJwt
  - id: create_comment_request
    description: POST request to create a comment on the article
    action:
      type: Unimplemented
      intended_type: CallHttp
  - id: assert_response
    description: Assert 201 Created response with comment details
    action:
      type: Unimplemented
      intended_type: HttpAssert
  - id: cleanup
    description: Clean up test data from database
    action:
      type: Unimplemented
      intended_type: ExecuteSql
