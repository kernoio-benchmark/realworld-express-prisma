- id: get_feed_authenticated_user_returns_200_with_articles
  description: Authenticated user retrieves their article feed successfully
  subject:
    type: Endpoint
    method: GET
    path: /api/articles/feed
  steps:
  - id: generate_test_data
    description: Generate test values for users and articles
    action:
      type: Unimplemented
      intended_type: Values
  - id: create_users
    description: Create test users - one who will follow another
    action:
      type: Unimplemented
      intended_type: ExecuteSql
  - id: create_articles
    description: Create articles authored by the followed user
    action:
      type: Unimplemented
      intended_type: ExecuteSql
  - id: create_follow_relationship
    description: Establish follow relationship between users
    action:
      type: Unimplemented
      intended_type: ExecuteSql
  - id: generate_token
    description: Generate JWT for the follower user
    action:
      type: Unimplemented
      intended_type: GenerateJwt
  - id: get_feed
    description: Call GET /api/articles/feed with authentication
    action:
      type: Unimplemented
      intended_type: CallHttp
  - id: assert_response
    description: Verify 200 response with articles from followed users
    action:
      type: Unimplemented
      intended_type: HttpAssert
  - id: cleanup
    description: Remove test data
    action:
      type: Unimplemented
      intended_type: ExecuteSql
