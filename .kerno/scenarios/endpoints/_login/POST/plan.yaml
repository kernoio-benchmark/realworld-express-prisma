add:
- id: login_with_valid_credentials_returns_200_with_token
  description: User logs in with valid email and password, receives 200 OK with user
    object containing JWT token
  subject:
    type: Endpoint
    method: POST
    path: /api/users/login
  steps:
  - id: generate_test_data
    description: Generate random email and static password for test user
    action:
      type: Unimplemented
      intended_type: Values
  - id: setup_test_user
    description: Create test user in database with hashed password
    action:
      type: Unimplemented
      intended_type: ExecuteSql
  - id: call_login
    description: POST to /api/users/login with valid credentials
    action:
      type: Unimplemented
      intended_type: CallHttp
  - id: assert_response
    description: Assert 200 OK response with user object containing token, email,
      username, bio, image
    action:
      type: Unimplemented
      intended_type: HttpAssert
  - id: cleanup
    description: Delete test user from database
    action:
      type: Unimplemented
      intended_type: ExecuteSql
