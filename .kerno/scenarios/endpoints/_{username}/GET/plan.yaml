- id: get_non_existent_profile
  description: Attempt to retrieve a non-existent user profile - should return 404
    Not Found
  subject:
    type: Endpoint
    method: GET
    path: /api/profiles/{username}
  steps:
  - id: generate_test_data
    description: Generate random username that doesn't exist
    action:
      type: Unimplemented
      intended_type: Values
  - id: cleanup_defensive
    description: Defensively ensure the username doesn't exist in database
    action:
      type: Unimplemented
      intended_type: ExecuteSql
  - id: call_get_profile
    description: Call GET /api/profiles/{username} for non-existent user
    action:
      type: Unimplemented
      intended_type: CallHttp
  - id: assert_response
    description: Assert 404 Not Found
    action:
      type: Unimplemented
      intended_type: HttpAssert