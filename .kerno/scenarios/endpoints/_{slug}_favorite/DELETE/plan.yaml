add:
- id: unfavorite_article_success
  description: Authenticated user successfully unfavorites an article they previously
    favorited
  subject:
    type: Endpoint
    method: DELETE
    path: /api/articles/{slug}/favorite
  steps:
  - id: generate_test_data
    description: Generate unique identifiers for test user and article
    action:
      type: Unimplemented
      intended_type: Values
  - id: setup_user
    description: Create test user via registration endpoint
    action:
      type: Unimplemented
      intended_type: CallHttp
  - id: setup_article
    description: Create test article for the user to unfavorite
    action:
      type: Unimplemented
      intended_type: CallHttp
  - id: favorite_article
    description: First favorite the article so we can unfavorite it
    action:
      type: Unimplemented
      intended_type: CallHttp
  - id: generate_token
    description: Generate JWT token for authenticated request
    action:
      type: Unimplemented
      intended_type: GenerateJwt
  - id: unfavorite_article
    description: Execute DELETE request to unfavorite the article
    action:
      type: Unimplemented
      intended_type: CallHttp
  - id: assert_unfavorite_response
    description: Verify 200 response with favorited=false and decremented favoritesCount
    action:
      type: Unimplemented
      intended_type: HttpAssert
  - id: cleanup_article
    description: Delete the test article
    action:
      type: Unimplemented
      intended_type: CallHttp
  - id: cleanup_user
    description: Clean up test user from database
    action:
      type: Unimplemented
      intended_type: ExecuteSql
