add:
- id: favorite_article_with_valid_auth
  description: User with valid authentication successfully favorites an existing article
  subject:
    type: Endpoint
    method: POST
    path: /api/articles/{slug}/favorite
  steps:
  - id: values
    description: Generate test data for user and article
    action:
      type: Unimplemented
      intended_type: Values
  - id: setup_user
    description: Create a test user in the database
    action:
      type: Unimplemented
      intended_type: ExecuteSql
  - id: setup_article
    description: Create a test article in the database
    action:
      type: Unimplemented
      intended_type: ExecuteSql
  - id: generate_token
    description: Generate JWT token for the test user
    action:
      type: Unimplemented
      intended_type: GenerateJwt
  - id: favorite_article
    description: Call POST /api/articles/{slug}/favorite with valid token
    action:
      type: Unimplemented
      intended_type: CallHttp
  - id: assert_response
    description: Assert 200 OK response with article marked as favorited
    action:
      type: Unimplemented
      intended_type: HttpAssert
  - id: cleanup
    description: Remove test data from database
    action:
      type: Unimplemented
      intended_type: ExecuteSql
