- id: create_article_success_with_tags
  description: Authenticated user creates article with valid data including tags returns
    201
  subject:
    type: Endpoint
    method: POST
    path: /api/articles
  steps:
  - id: generate_values
    description: Generate test data for article creation
    action:
      type: Unimplemented
      intended_type: Values
  - id: create_user
    description: Create test user via registration endpoint
    action:
      type: Unimplemented
      intended_type: CallHttp
  - id: generate_token
    description: Generate JWT token for authenticated user
    action:
      type: Unimplemented
      intended_type: GenerateJwt
  - id: create_article
    description: POST request to create article with title, description, body, and
      tagList
    action:
      type: Unimplemented
      intended_type: CallHttp
  - id: assert_response
    description: Verify 201 status and response contains article with slug, tags,
      author info
    action:
      type: Unimplemented
      intended_type: HttpAssert
  - id: cleanup_article
    description: Delete created article from database
    action:
      type: Unimplemented
      intended_type: ExecuteSql
  - id: cleanup_user
    description: Delete test user from database
    action:
      type: Unimplemented
      intended_type: ExecuteSql
