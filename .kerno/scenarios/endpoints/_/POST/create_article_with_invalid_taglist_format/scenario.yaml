id: create_article_with_invalid_taglist_format
description: |
  POST / with valid auth but tagList as non-array (e.g., string) should
  return 400 Bad Request with validation error.
subject:
  type: Endpoint
  method: POST
  path: /
steps:
- id: generate_test_data
  description: Generate random values for article fields
  action:
    type: Values
    outputs:
      username:
        type: RandomUuid
      email:
        type: RandomUuid
      password:
        type: StaticString
        value: Test123!
      title:
        type: StaticString
        value: Test Article
      description:
        type: StaticString
        value: Test Description
      body:
        type: StaticString
        value: Test Body
- id: create_user
  description: Create a test user via registration endpoint
  action:
    type: CallHttp
    request: |-
      POST /api/users HTTP/1.1
      Content-Type: application/json

      {"user": {"username": "{{ generate_test_data.username }}", "email": "{{ generate_test_data.email }}@test.com", "password": "{{ generate_test_data.password }}"}}
- id: generate_token
  description: Generate JWT token for the created user
  action:
    type: GenerateJwt
    claims: |-
      {
        "user": {
          "username": "{{ generate_test_data.username }}"
        }
      }
- id: create_article_invalid_taglist
  description: POST / with tagList as string instead of array
  action:
    type: CallHttp
    request: |-
      POST /api/articles HTTP/1.1
      Authorization: Token {{ generate_token }}
      Content-Type: application/json

      {"article": {"title": "{{ generate_test_data.title }}", "description": "{{ generate_test_data.description }}", "body": "{{ generate_test_data.body }}", "tagList": "invalid-string"}}
- id: assert_bad_request
  description: Assert 400 Bad Request with tagList validation error
  action:
    type: HttpAssert
    actual: '{{ create_article_invalid_taglist }}'
    expected: |-
      HTTP/1.1 400 Bad Request
      Content-Type: application/json; charset=utf-8

      {"errors": {"body": ["tagList must be an array of non-empty strings"]}}
    body_match: json_lenient