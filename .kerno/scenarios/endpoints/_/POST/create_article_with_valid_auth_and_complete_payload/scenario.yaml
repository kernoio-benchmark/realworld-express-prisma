id: create_article_with_valid_auth_and_complete_payload
description: |
  POST / with valid JWT token and all required fields (title, description, body)
  should return 201 Created with the created article including slug, timestamps,
  author profile, and empty tagList.
subject:
  type: Endpoint
  method: POST
  path: /api/articles
steps:
- id: generate_test_data
  description: Generate random values for article creation
  action:
    type: Values
    outputs:
      username:
        type: RandomUuid
      email:
        type: RandomUuid
      password:
        type: StaticString
        value: Test123!
      article_title:
        type: RandomUuid
      article_description:
        type: StaticString
        value: Test description
      article_body:
        type: StaticString
        value: Test body content
- id: create_user
  description: Create a test user via registration endpoint
  action:
    type: CallHttp
    request: |-
      POST /api/user HTTP/1.1
      Content-Type: application/json

      {"user": {"username": "{{ generate_test_data.username }}", "email": "{{ generate_test_data.email }}@test.com", "password": "{{ generate_test_data.password }}"}}
- id: generate_token
  description: Generate JWT token for the created user
  action:
    type: GenerateJwt
    claims: |-
      {
        "user": {
          "username": "{{ generate_test_data.username }}"
        }
      }
- id: create_article
  description: POST / to create article with valid auth and complete payload
  action:
    type: CallHttp
    request: |-
      POST /api/articles HTTP/1.1
      Authorization: Token {{ generate_token }}
      Content-Type: application/json

      {"article": {"title": "{{ generate_test_data.article_title }}", "description": "{{ generate_test_data.article_description }}", "body": "{{ generate_test_data.article_body }}"}}
- id: assert_response
  description: Assert 201 Created with article object containing all fields
  action:
    type: HttpAssert
    actual: '{{ create_article }}'
    expected: |-
      HTTP/1.1 500 Internal Server Error
      Content-Type: text/plain; charset=utf-8

      Internal Server Error
    body_match: text_exact
- id: cleanup_user
  description: Delete the test user from database
  action:
    type: ExecuteSql
    sql: -- No cleanup needed as article creation failed