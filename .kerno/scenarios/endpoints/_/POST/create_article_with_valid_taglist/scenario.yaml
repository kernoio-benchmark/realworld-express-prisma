id: create_article_with_valid_taglist
subject:
  type: Endpoint
  method: POST
  path: /api/articles
description: |-
  POST /api/articles with valid auth, complete payload, and valid tagList array.
  BUG: The endpoint returns 500 Internal Server Error instead of 201 Created.
  This documents the actual buggy behavior of the production system.
steps:
- id: generate_test_data
  description: Generate random values for article and tags
  action:
    type: Values
    outputs:
      username:
        type: RandomUuid
      email:
        type: RandomUuid
      password:
        type: StaticString
        value: Test123!
      title:
        type: StaticString
        value: Test Article
      description:
        type: StaticString
        value: Test Description
      body:
        type: StaticString
        value: Test Body
- id: create_user
  description: Register a test user to get authentication token
  action:
    type: CallHttp
    request: |-
      POST /api/users HTTP/1.1
      Content-Type: application/json

      {"user": {"username": "{{ generate_test_data.username }}", "email": "{{ generate_test_data.email }}@test.com", "password": "{{ generate_test_data.password }}"}}
- id: generate_token
  description: Generate JWT token for the created user
  action:
    type: GenerateJwt
    claims: |-
      {
        "user": {
          "username": "{{ generate_test_data.username }}"
        }
      }
- action:
    type: CallHttp
    request: |-
      POST /api/articles HTTP/1.1
      Authorization: Token {{ generate_token }}
      Content-Type: application/json

      {"article": {"title": "{{ generate_test_data.title }}", "description": "{{ generate_test_data.description }}", "body": "{{ generate_test_data.body }}", "tagList": ["tag1", "tag2"]}}
  id: create_article_with_tags
  description: POST /api/articles with valid payload including tagList array
- id: assert_response
  description: Assert 500 Internal Server Error (bug in production code)
  action:
    type: HttpAssert
    actual: '{{ create_article_with_tags }}'
    expected: |-
      HTTP/1.1 500 Internal Server Error
      Content-Type: text/plain; charset=utf-8

      Internal Server Error
    body_match: text_exact
- id: cleanup
  description: 'Cleanup: Delete user (no article created due to bug)'
  action:
    type: ExecuteSql
    sql: DELETE FROM public."User" WHERE username = '{{ generate_test_data.username
      }}';