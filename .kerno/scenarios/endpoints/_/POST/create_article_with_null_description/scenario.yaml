id: create_article_with_null_description
description: |
  POST / with valid auth but description set to null should return
  400 Bad Request with validation error.
subject:
  type: Endpoint
  method: POST
  path: /
steps:
- id: generate_test_data
  description: Generate random values for title and body
  action:
    type: Values
    outputs:
      username:
        type: RandomUuid
      email:
        type: RandomUuid
      password:
        type: StaticString
        value: Test123!
      title:
        type: RandomUuid
      body:
        type: RandomUuid
- id: create_user
  description: Create a test user via registration endpoint
  action:
    type: CallHttp
    request: |-
      POST /api/user HTTP/1.1
      Content-Type: application/json

      {"user": {"username": "{{ generate_test_data.username }}", "email": "{{ generate_test_data.email }}@test.com", "password": "{{ generate_test_data.password }}"}}
- id: generate_token
  description: Generate JWT token for the created user
  action:
    type: GenerateJwt
    claims: |-
      {
        "user": {
          "username": "{{ generate_test_data.username }}"
        }
      }
- id: create_article_null_description
  description: POST / with description as null
  action:
    type: CallHttp
    request: |-
      POST /api/articles HTTP/1.1
      Authorization: Token {{ generate_token }}
      Content-Type: application/json

      {"article": {"title": "{{ generate_test_data.title }}", "description": null, "body": "{{ generate_test_data.body }}"}}
- id: assert_bad_request
  description: Assert 400 Bad Request with description validation error
  action:
    type: HttpAssert
    actual: '{{ create_article_null_description }}'
    expected: |-
      HTTP/1.1 400 Bad Request
      Content-Type: application/json; charset=utf-8

      {"errors": {"body": ["description field must be a non-empty string"]}}
    body_match: json_lenient