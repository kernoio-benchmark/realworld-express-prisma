id: create_article_with_empty_string_title
description: |
  POST / with valid auth but title set to empty string should return
  400 Bad Request with validation error.
subject:
  type: Endpoint
  method: POST
  path: /api/articles
steps:
- id: generate_test_data
  description: Generate random values for description and body
  action:
    type: Values
    outputs:
      username:
        type: RandomUuid
      email:
        type: RandomUuid
      description:
        type: StaticString
        value: Test description
      body:
        type: StaticString
        value: Test body
- id: create_user
  description: Create a test user via registration endpoint
  action:
    type: CallHttp
    request: |-
      POST /api/users HTTP/1.1
      Content-Type: application/json

      {
        "user": {
          "username": "{{ generate_test_data.username }}",
          "email": "{{ generate_test_data.email }}@test.com",
          "password": "Test123!"
        }
      }
- id: generate_token
  description: Generate JWT token for the created user
  action:
    type: GenerateJwt
    claims: |-
      {
        "user": {
          "username": "{{ generate_test_data.username }}"
        }
      }
- id: create_article_empty_title
  description: POST / with title as empty string
  action:
    type: CallHttp
    request: |-
      POST /api/articles HTTP/1.1
      Authorization: Token {{ generate_token }}
      Content-Type: application/json

      {
        "article": {
          "title": "",
          "description": "{{ generate_test_data.description }}",
          "body": "{{ generate_test_data.body }}"
        }
      }
- id: assert_bad_request
  description: Assert 400 Bad Request with title validation error
  action:
    type: HttpAssert
    actual: '{{ create_article_empty_title }}'
    expected: |-
      HTTP/1.1 400 Bad Request
      Content-Type: application/json; charset=utf-8

      {
        "errors": {
          "body": ["title field must be a non-empty string"]
        }
      }
    body_match: json_lenient
- id: cleanup_user
  description: Delete the test user from database
  action:
    type: ExecuteSql
    sql: SELECT tablename FROM pg_tables WHERE schemaname = 'public';