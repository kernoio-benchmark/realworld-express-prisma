add:
- id: get_tags_success_with_data
  description: Verify GET /api/tags returns 200 OK with list of tags when tags exist
    in database
  subject:
    type: Endpoint
    method: GET
    path: /api/tags
  steps:
  - id: setup_values
    description: Generate random tag names for test repeatability
    action:
      type: Unimplemented
      intended_type: Values
  - id: setup_tags
    description: Clean up any existing test tags and insert test tags into database
    action:
      type: Unimplemented
      intended_type: ExecuteSql
  - id: call_get_tags
    description: Call GET /api/tags endpoint without authentication
    action:
      type: Unimplemented
      intended_type: CallHttp
  - id: assert_response
    description: Assert 200 OK with JSON array containing the test tags
    action:
      type: Unimplemented
      intended_type: HttpAssert
  - id: cleanup
    description: Remove test tags from database
    action:
      type: Unimplemented
      intended_type: ExecuteSql
- id: get_tags_empty_list
  description: Verify GET /api/tags returns 200 OK with empty array when no tags exist
  subject:
    type: Endpoint
    method: GET
    path: /api/tags
  steps:
  - id: cleanup_all_tags
    description: Remove all tags from database to ensure empty state
    action:
      type: Unimplemented
      intended_type: ExecuteSql
  - id: call_get_tags
    description: Call GET /api/tags endpoint without authentication
    action:
      type: Unimplemented
      intended_type: CallHttp
  - id: assert_empty_response
    description: Assert 200 OK with empty tags array
    action:
      type: Unimplemented
      intended_type: HttpAssert
  - id: restore_tags
    description: Restore any tags that may have existed before test (optional cleanup)
    action:
      type: Unimplemented
      intended_type: ExecuteSql
untouched: []
check: []
remove: []